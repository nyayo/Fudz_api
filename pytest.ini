[pytest]
DJANGO_SETTINGS_MODULE = Fudz_api.test_settings
python_files = test_*.py
addopts = -x --strict-markers -q
testpaths =
    users
    restaurants
    orders
    delivery
    reviews
    wishlist
markers =
    models: model/constraint tests
    serializers: serializer validation tests
    views: API endpoint tests
    tasks: Celery task tests
    signals: signal side-effect tests
filterwarnings =
    ignore::DeprecationWarning
